<!-- Form Card Container -->
<div class="form-container animate-fade-in">
    <div class="form-header-wrapper">
        <h3 class="form-title">User Registration</h3>
        <p class="form-subtitle">Add a new system administrator</p>
    </div>

    <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="atm-form">

        <!-- Name Input Field Group -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input id="name" type="text" formControlName="name" placeholder="Enter full name" class="form-control">
        </div>

        <!-- Email Input Field Group -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" formControlName="email" placeholder="name@example.com" class="form-control">
        </div>

        <!-- Role Selection Dropdown Group -->
        <div class="form-group">
            <label for="role">Assign Role</label>
            <div class="select-wrapper">
                <select id="role" formControlName="role" class="form-control">
                    <option value="" disabled selected>Select system role</option>
                    <option value="AREA_ADMIN">AREA_ADMIN</option>
                    <option value="SUPER_ADMIN">SUPER_ADMIN</option>
                </select>
            </div>
        </div>

        <!-- Submit Action Button -->
        <div class="form-actions">
            <button type="submit" [disabled]="userForm.invalid" class="btn-submit">
                Add User
            </button>
        </div>

    </form>
</div>
