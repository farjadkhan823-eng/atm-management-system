<header class="atm-header">
    <!-- Left Section: Page Title & Breadcrumb/Greeting -->
    <div class="header-left">
        <h1 class="page-title">Dashboard</h1>
        <p class="welcome-text">Welcome back, <span class="account-holder">Muhammad Farjad</span></p>
    </div>

    <!-- Right Section: Actions, Notifications & Theme Toggle -->
    <div class="header-right">
        <!-- Quick Status Badge (Active Account) -->
        <div class="status-badge">
            <span class="status-dot"></span>
            <span class="status-label">Account Active</span>
        </div>

        <!-- Notification Bell Button -->
        <button class="icon-btn" aria-label="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </button>

        <app-theme-button></app-theme-button>
    </div>
</header>
